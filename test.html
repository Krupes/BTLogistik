<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Орбита Преимуществ — Final Synchronized</title>
    <style>
        /* =====================================================================
           HEADER PREMIUM — стеклянная «капсула» с золотой кромкой
           Подключать ПОСЛЕ responsive.css. Удалите файл — шапка вернётся к прежнему виду.
           ===================================================================== */
        :root{
            --gold-1: #fff7d6;   /* блик */
            --gold-2: #f3df9d;   /* светлое золото */
            --gold-3: #d4af37;   /* основное золото */
            --gold-4: #8a6a14;   /* тень металла */
        }

        /* ---------- Контейнер-стекло ---------- */
        .header.glass-header{
            padding: 0 10px 0 22px;
            min-height: 64px;
            border: 0;
            border-radius: 999px;
            background:
                    linear-gradient(180deg, rgba(255,255,255,.13) 0%, rgba(255,255,255,.03) 48%, rgba(255,255,255,.06) 100%),
                    rgba(5, 28, 22, .46);
            -webkit-backdrop-filter: blur(20px) saturate(170%);
            backdrop-filter: blur(20px) saturate(170%);
            box-shadow:
                    0 18px 50px rgba(0,0,0,.50),               /* отрыв от фона */
                    0 0 46px rgba(212,175,55,.13),             /* золотое свечение вокруг */
                    inset 0 1px 0 rgba(255,255,255,.38),       /* верхний блик стекла */
                    inset 0 -1px 0 rgba(212,175,55,.22);       /* нижняя кромка */
        }
        /* градиентная кромка: золото → белый → золото */
        .header.glass-header::after{
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(100deg,
            rgba(212,175,55,.85) 0%, rgba(255,255,255,.55) 22%,
            rgba(212,175,55,.18) 50%,
            rgba(255,255,255,.45) 78%, rgba(212,175,55,.85) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        /* тонкая «линза» света по верхнему краю */
        .header.glass-header::before{
            content: "";
            position: absolute;
            top: 0; left: 12%; right: 12%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,247,214,.95), transparent);
            filter: blur(.4px);
            pointer-events: none;
        }

        /* ---------- Логотип ---------- */
        .header-logo{ width: auto; flex-shrink: 0; }
        .header-logo .brand{
            display: inline-flex;
            align-items: center;
            gap: 12px;
            min-height: var(--tap);
            text-decoration: none;
        }
        .brand-mark{
            display: block;
            width: 52px; height: auto; flex: none;
            filter: drop-shadow(0 0 8px rgba(212,175,55,.45));
            transition: filter .4s ease, transform .4s ease;
        }
        .brand:hover .brand-mark{ filter: drop-shadow(0 0 14px rgba(255,231,150,.8)); transform: scale(1.04); }
        .brand-name{
            font-family: 'Ubuntu-bold', 'Ubuntu', sans-serif;
            font-size: 21px;
            letter-spacing: .01em;
            line-height: 1;
            white-space: nowrap;
            background: linear-gradient(180deg, #ffffff 0%, var(--gold-2) 48%, var(--gold-3) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,.45));
        }

        /* ---------- Меню ---------- */
        .header-container{ gap: 20px; }
        .header-menu-nav{ gap: 2px; }
        .header-menu-nav .nav-item{
            position: relative;
            padding: 0 clamp(10px, 1.1vw, 16px);
            font-family: 'Roboto', sans-serif;
            font-size: 12px;
            font-weight: 400;
            letter-spacing: .12em;
            color: rgba(255,255,255,.84);
            transition: color .3s ease, text-shadow .3s ease;
        }
        .header-menu-nav .nav-item::after{
            left: clamp(10px, 1.1vw, 16px);
            right: clamp(10px, 1.1vw, 16px);
            bottom: 12px;
            width: auto;
            height: 1px;
            transform: scaleX(0);
            transform-origin: center;
            background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
            box-shadow: 0 0 10px 1px rgba(243,223,157,.65);
            transition: transform .35s cubic-bezier(.2,.8,.2,1);
        }
        .header-menu-nav .nav-item:hover,
        .header-menu-nav .nav-item:focus-visible{
            color: var(--gold-1);
            text-shadow: 0 0 14px rgba(243,223,157,.55);
            outline: none;
        }
        .header-menu-nav .nav-item:hover::after,
        .header-menu-nav .nav-item:focus-visible::after{
            width: auto;
            transform: scaleX(1);
        }

        /* ---------- CTA: стеклянная кнопка с золотой кромкой ---------- */
        .header-contacts .premium-gold-btn{
            min-height: 44px;
            padding: 0 26px;
            border: 1px solid rgba(230,194,122,.75);
            border-radius: 999px;
            background:
                    radial-gradient(120% 160% at 50% -40%, rgba(255,247,214,.34), transparent 60%),
                    linear-gradient(135deg, rgba(243,223,157,.20), rgba(212,175,55,.05));
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            box-shadow:
                    inset 0 1px 0 rgba(255,255,255,.40),
                    inset 0 -8px 16px rgba(212,175,55,.10),
                    0 0 22px rgba(212,175,55,.22);
            transition: box-shadow .35s ease, border-color .35s ease, background .35s ease, transform .35s ease;
        }
        .header-contacts .premium-gold-btn span{
            font-family: 'Roboto', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: .16em;
            color: var(--gold-1);
            text-shadow: 0 0 10px rgba(243,223,157,.35);
        }
        /* ::before — вместо золотого «shimmer» делаем узкий блик, который пробегает по кнопке при наведении */
        .header-contacts .premium-gold-btn::before{
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.38), transparent);
            transform: skewX(-20deg);
            animation: none;
            transition: left .7s ease;
        }
        .header-contacts .premium-gold-btn:hover{
            transform: translateY(-1px);
            border-color: rgba(255,231,150,.95);
            background:
                    radial-gradient(120% 160% at 50% -40%, rgba(255,247,214,.5), transparent 60%),
                    linear-gradient(135deg, rgba(243,223,157,.30), rgba(212,175,55,.10));
            box-shadow:
                    inset 0 1px 0 rgba(255,255,255,.55),
                    inset 0 -8px 16px rgba(212,175,55,.16),
                    0 0 34px rgba(243,223,157,.42);
        }
        .header-contacts .premium-gold-btn:hover::before{ left: 120%; }
        .header-contacts .premium-gold-btn:focus-visible{ outline: 2px solid var(--gold-2); outline-offset: 3px; }

        /* ---------- Бургер в том же стиле ---------- */
        .burger{
            border-color: rgba(230,194,122,.55);
            background: radial-gradient(120% 160% at 50% -40%, rgba(255,247,214,.28), transparent 60%), rgba(255,255,255,.04);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 16px rgba(212,175,55,.18);
        }
        .burger span{ background: var(--gold-2); }

        /* ---------- Адаптив шапки ---------- */
        @media (min-width: 1201px) and (max-width: 1360px){
            .header-logo{ width: auto; }
            .brand-mark{ width: 46px; }
            .brand-name{ font-size: 19px; }
            .header-menu-nav .nav-item{ font-size: 11.5px; letter-spacing: .1em; padding: 0 10px; }
            .header-menu-nav .nav-item::after{ left: 10px; right: 10px; }
            .header-contacts .premium-gold-btn{ padding: 0 20px; }
            .header-contacts .premium-gold-btn span{ font-size: 11.5px; letter-spacing: .12em; }
        }
        @media (max-width: 1200px){
            .header.glass-header{ padding: 0 8px 0 16px; min-height: 60px; }
            .header-logo{ width: auto; }
            .header-drawer{
                background: rgba(7,30,24,.98);
                border: 1px solid rgba(230,194,122,.4);
                box-shadow: 0 24px 50px rgba(0,0,0,.55), 0 0 30px rgba(212,175,55,.12);
            }
            .header-menu-nav .nav-item{ font-size: 13px; letter-spacing: .12em; }
            .header-menu-nav .nav-item::after{ display: none; }
        }
        @media (max-width: 420px){
            .brand{ gap: 9px; }
            .brand-mark{ width: 40px; }
            .brand-name{ font-size: 17px; }
        }
        @media (max-width: 340px){
            .brand-name{ font-size: 15px; }
        }
    </style>
</head>
<body>
<section class="header glass-header">
    <div class="header-container">
        <div class="header-logo">
            <a href="#">
                <img src="img/header_logo2.png" alt="">
            </a>


        </div>

        <div class="header-menu ">
            <nav class="header-menu-nav">
                <a href="" class="nav-item">Таможенное оформление</a>
                <a href="" class="nav-item">Услуги склада</a>
                <a href="" class="nav-item">Маркировка</a>
                <a href="" class="nav-item">Контакты</a>
                <a href="" class="nav-item">О Нас</a>
            </nav>
        </div>
        <div class="header-contacts ">
            <button class="premium-gold-btn">
                <span>Связаться с нами</span></button>

        </div>
    </div>
</section>


</body>
</html>
